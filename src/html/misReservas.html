<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/a0c53b3773.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/panelAdminEspacios.css">
    <link rel="stylesheet" href="../css/misReservas.css">
    <title>Mis Reservas</title>
</head>

<body>
    <div class="admin-shell">
        <aside class="sidebar">
            <a href="panelUsuario.html" class="brand" aria-label="UrbaPadel">
                <img src="../img/UrbaSpaceLogo.png" alt="Logo de UrbaSpace" class="logo">
            </a>

            <nav class="sidebar-nav" aria-label="Panel usuario">
                <p class="nav-title">Panel Usuario</p>

                <a href="panelUsuario.html" class="nav-item">
                    <i class="fa-solid fa-table-cells-large"></i>
                    <span>Mis Espacios</span>
                </a>

                <a href="misReservas.html" class="nav-item active" aria-current="page">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>Mis Reservas</span>
                    <span class="nav-badge" id="reservas-badge" hidden>0</span>
                </a>

                <a href="incidenciasUsuario.html" class="nav-item">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>Incidencias</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="#" class="nav-item">
                    <i class="fa-solid fa-gear"></i>
                    <span>Ajustes</span>
                </a>
                <a href="#" class="nav-item logout" id="logout">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>Cerrar Sesión</span>
                </a>
            </div>
        </aside>

        <main class="main-panel">
            <header class="topbar">
                <div class="breadcrumbs" aria-label="Ruta">
                    <span>Panel Usuario</span>
                    <i class="fa-solid fa-chevron-right"></i>
                    <strong>Mis Reservas</strong>
                </div>

                <button class="user-menu" type="button" aria-label="Menú de usuario">
                    <i class="fa-solid fa-user avatar"></i>
                    <span id="usuario-name">Usuario</span>
                </button>
            </header>

            <section class="content">
                <div class="content-header">
                    <div>
                        <h1>Mis Reservas</h1>
                        <p>Consulta tus reservas activas, canceladas e históricas.</p>
                    </div>

                    <a class="btn btn-secondary" href="panelUsuario.html">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>Volver a espacios</span>
                    </a>
                </div>

                <section class="list-card" aria-label="Listado de reservas">
                    <div class="reservas-tabs">
                        <button class="tab-btn active" type="button" data-filter="activas">
                            Activas
                        </button>
                        <button class="tab-btn" type="button" data-filter="historial">
                            Historial
                        </button>
                        <button class="tab-btn" type="button" data-filter="todas">
                            Todas
                        </button>
                    </div>

                    <div class="table-wrap">
                        <table class="spaces-table">
                            <thead>
                                <tr>
                                    <th>Espacio</th>
                                    <th>Fecha</th>
                                    <th>Horario</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="reservas-table-body"></tbody>
                        </table>
                    </div>

                    <div class="list-footer">
                        <p id="reservas-count">Mostrando 0 reservas</p>
                    </div>
                </section>
            </section>
        </main>
    </div>

    <script src="../js/misReservas.js"></script>
    <script src="../js/notificacionesUsuario.js"></script>
</body>

</html>
