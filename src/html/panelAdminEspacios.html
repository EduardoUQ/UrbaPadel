<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/a0c53b3773.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/panelAdminEspacios.css">
    <title>Espacios y Pistas</title>
</head>

<body>
    <div class="admin-shell">
        <aside class="sidebar">
            <a href="panelAdminUrbanizaciones.html" class="brand" aria-label="UrbaPadel">
                <img src="../img/UrbaSpaceLogo.png" alt="Logo de UrbaSpace" class="logo">
            </a>

            <nav class="sidebar-nav" aria-label="Navegación principal">
                <a href="panelAdminUrbanizaciones.html" class="nav-item">
                    <i class="fa-solid fa-chart-column"></i>
                    <span>Panel General</span>
                </a>
                <a href="panelAdminEspacios.html" class="nav-item active" aria-current="page">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>Espacios</span>
                </a>
                <a href="panelAdminViviendas.html" class="nav-item" id="nav-viviendas">
                    <i class="fa-solid fa-users"></i>
                    <span>Viviendas</span>
                </a>

                <a href="panelAdminReservas.html" class="nav-item" id="nav-reservas">
                    <i class="fa-regular fa-calendar-check"></i>
                    <span>Reservas</span>
                </a>

                <a href="panelAdminIncidencias.html" class="nav-item" id="nav-incidencias">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>Incidencias</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="#" class="nav-item">
                    <i class="fa-solid fa-gear"></i>
                    <span>Ajustes</span>
                </a>
                <a href="#" class="nav-item logout" id="logout">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>Cerrar Sesión</span>
                </a>
            </div>
        </aside>

        <main class="main-panel">
            <header class="topbar">
                <div class="breadcrumbs" aria-label="Ruta">
                    <span id="breadcrumb-urbanization"></span>
                    <span>Espacios</span>
                </div>

                <button class="user-menu" type="button" aria-label="Menú de usuario">
                    <i class="fa-solid fa-user avatar"></i>
                    <span id="admin-name">Administrador</span>
                </button>
            </header>

            <section class="content">
                <div class="content-header">
                    <div>
                        <h1>Espacios y Pistas</h1>
                        <p>Gestiona las instalaciones disponibles para reservas en <span id="urbanization-name">la
                                comunidad</span>.</p>
                    </div>

                    <a class="btn btn-primary" href="panelAdminFormularioEspacios.html" id="create-space">
                        <i class="fa-solid fa-plus"></i>
                        <span>Nuevo Espacio</span>
                    </a>
                </div>

                <section class="list-card" aria-label="Listado de espacios">
                    <!-- <div class="list-toolbar">
                        <label class="search-box" for="spaceSearch">
                            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                            <input id="spaceSearch" type="search" placeholder="Buscar espacio...">
                        </label>
                    </div> -->

                    <div class="table-wrap">
                        <table class="spaces-table">
                            <thead>
                                <tr>
                                    <th>Espacio</th>
                                    <th>Tipo</th>
                                    <th>Horario</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="spaces-table-body"></tbody>
                        </table>
                    </div>

                    <div class="list-footer">
                        <p id="spaces-count">Mostrando 0 espacios</p>
                        <div class="pagination" id="spaces-pagination" hidden>
                            <button class="btn btn-secondary" id="prev-page" type="button">Anterior</button>
                            <button class="btn btn-secondary" id="next-page" type="button">Siguiente</button>
                        </div>
                    </div>
                </section>
            </section>
        </main>
    </div>

    <script src="../js/panelAdminEspacios.js"></script>
</body>

</html>
