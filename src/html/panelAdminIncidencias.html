<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/a0c53b3773.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/panelAdminEspacios.css">
    <link rel="stylesheet" href="../css/panelAdminIncidencias.css">
    <title>Incidencias</title>
</head>

<body>
    <div class="admin-shell">
        <aside class="sidebar">
            <a href="panelAdminUrbanizaciones.html" class="brand" aria-label="UrbaPadel">
                <span class="brand-mark" aria-hidden="true">
                    <i class="fa-regular fa-building"></i>
                </span>
                <span>UrbaPadel</span>
            </a>

            <nav class="sidebar-nav" aria-label="Navegación principal">
                <a href="panelAdminUrbanizaciones.html" class="nav-item">
                    <i class="fa-solid fa-chart-column"></i>
                    <span>Panel General</span>
                </a>

                <a href="panelAdminEspacios.html" class="nav-item" id="nav-espacios">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>Espacios</span>
                </a>

                <a href="panelAdminViviendas.html" class="nav-item" id="nav-viviendas">
                    <i class="fa-solid fa-users"></i>
                    <span>Viviendas</span>
                </a>

                <a href="panelAdminReservas.html" class="nav-item" id="nav-reservas">
                    <i class="fa-regular fa-calendar-check"></i>
                    <span>Reservas</span>
                </a>

                <a href="panelAdminIncidencias.html" class="nav-item active" id="nav-incidencias" aria-current="page">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>Incidencias</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="#" class="nav-item">
                    <i class="fa-solid fa-gear"></i>
                    <span>Ajustes</span>
                </a>
                <a href="#" class="nav-item logout" id="logout">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>Cerrar Sesión</span>
                </a>
            </div>
        </aside>

        <main class="main-panel">
            <header class="topbar">
                <div class="breadcrumbs" aria-label="Ruta">
                    <span>Incidencias</span>
                </div>

                <button class="user-menu" type="button" aria-label="Menú de usuario">
                    <i class="fa-solid fa-user avatar"></i>
                    <span id="admin-name">Administrador</span>
                </button>
            </header>

            <section class="content">
                <div class="content-header">
                    <div>
                        <h1>Incidencias</h1>
                        <p>Consulta y gestiona las incidencias comunicadas por las viviendas de <span id="urbanization-name">la comunidad</span>.</p>
                    </div>
                </div>

                <section class="list-card" aria-label="Listado de incidencias">
                    <div class="incidencias-tabs">
                        <button class="tab-btn active" type="button" data-filter="pendientes">Pendientes</button>
                        <button class="tab-btn" type="button" data-filter="resueltas">Resueltas</button>
                        <button class="tab-btn" type="button" data-filter="todas">Todas</button>
                    </div>

                    <div class="table-wrap">
                        <table class="spaces-table incidencias-table">
                            <thead>
                                <tr>
                                    <th>Espacio</th>
                                    <th>Vivienda</th>
                                    <th>Comentario</th>
                                    <th>Fecha</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="incidencias-table-body"></tbody>
                        </table>
                    </div>

                    <div class="list-footer">
                        <p id="incidencias-count">Mostrando 0 incidencias</p>
                    </div>
                </section>
            </section>
        </main>
    </div>

    <script src="../js/panelAdminIncidencias.js"></script>
</body>

</html>
