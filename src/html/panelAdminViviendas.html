<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/a0c53b3773.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/panelAdminViviendas.css">
    <link rel="icon" href="data:,">
    <title>Viviendas</title>
</head>

<body>
    <div class="admin-shell">
        <aside class="sidebar">
            <a href="panelAdminUrbanizaciones.html" class="brand" aria-label="UrbaPadel">
                <img src="../img/UrbaSpaceLogo.png" alt="Logo de UrbaSpace" class="logo">
            </a>

            <nav class="sidebar-nav" aria-label="Navegación principal">
                <a href="panelAdminUrbanizaciones.html" class="nav-item">
                    <i class="fa-solid fa-chart-column"></i>
                    <span>Panel General</span>
                </a>
                <a href="panelAdminEspacios.html" class="nav-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>Espacios</span>
                </a>
                <a href="#" class="nav-item active" aria-current="page">
                    <i class="fa-solid fa-users"></i>
                    <span>Viviendas</span>
                </a>

                <a href="panelAdminReservas.html" class="nav-item" id="nav-reservas">
                    <i class="fa-regular fa-calendar-check"></i>
                    <span>Reservas</span>
                </a>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="#" class="nav-item">
                    <i class="fa-solid fa-gear"></i>
                    <span>Ajustes</span>
                </a>
                <a href="#" class="nav-item logout" id="logout">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>Cerrar Sesión</span>
                </a>
            </div>
        </aside>

        <main class="main-panel">
            <header class="topbar">
                <div class="breadcrumbs">
                    <span id="breadcrumb-urbanization"></span>
                    <span>Viviendas</span>
                </div>

                <button class="user-menu" type="button">
                    <i class="fa-solid fa-user avatar"></i>
                    <span id="admin-name">Administrador</span>
                </button>
            </header>

            <section class="content">
                <div class="content-header">
                    <div>
                        <h1>Viviendas</h1>
                        <p>Importa viviendas mediante CSV para <span id="urbanization-name">la comunidad</span>.</p>
                    </div>

                    <label class="btn btn-primary" for="csv-file">
                        <i class="fa-solid fa-file-csv"></i>
                        <span>Subir archivo de viviendas</span>
                    </label>
                    <input id="csv-file" type="file" accept=".csv,text/csv" hidden>
                </div>

                <section class="list-card">
                    <div class="list-toolbar">
                        <p class="toolbar-help" id="toolbar-help">
                            Sube un CSV, revisa los datos, modifica lo necesario y pulsa guardar.
                        </p>
                    </div>

                    <div class="saved-controls" id="saved-controls" hidden>
                        <div class="filters-grid">
                            <input id="filter-id" type="text" placeholder="ID">
                            <input id="filter-codigo" type="text" placeholder="Código">
                            <input id="filter-usuario" type="text" placeholder="Usuario">
                            <input id="filter-email" type="text" placeholder="Email">
                            <input id="filter-telefono" type="text" placeholder="Teléfono">
                            <input id="filter-bloque" type="text" placeholder="Bloque">
                            <input id="filter-portal" type="text" placeholder="Portal">
                            <input id="filter-escalera" type="text" placeholder="Escalera">
                            <input id="filter-planta" type="text" placeholder="Planta">
                            <input id="filter-puerta" type="text" placeholder="Puerta">
                            <input id="filter-descripcion" type="text" placeholder="Descripción">

                            <select id="filter-superusuario">
                                <option value="">SU: todos</option>
                                <option value="1">Solo SU</option>
                                <option value="0">No SU</option>
                            </select>
                        </div>

                        <div class="filters-actions">
                            <button class="btn btn-primary" id="apply-filters" type="button">
                                <i class="fa-solid fa-filter"></i>
                                <span>Filtrar</span>
                            </button>

                            <button class="btn btn-secondary" id="clear-filters" type="button">
                                <i class="fa-solid fa-eraser"></i>
                                <span>Limpiar</span>
                            </button>

                            <label class="page-size-label" for="page-size">
                                Mostrar
                                <select id="page-size">
                                    <option value="all">Todas</option>
                                    <option value="10">10</option>
                                    <option value="20">20</option>
                                </select>
                            </label>
                        </div>
                    </div>

                    <div class="table-wrap">
                        <table class="viviendas-table">
                            <thead id="viviendas-table-head"></thead>
                            <tbody id="viviendas-table-body"></tbody>
                        </table>
                    </div>

                    <div class="list-footer">
                        <p id="viviendas-count">Mostrando 0 viviendas</p>

                        <div class="pagination" id="pagination-controls" hidden>
                            <button class="btn btn-secondary" id="prev-page" type="button">Anterior</button>
                            <span id="page-info">Página 1 de 1</span>
                            <button class="btn btn-secondary" id="next-page" type="button">Siguiente</button>
                        </div>

                        <div class="footer-actions">
                            <button class="btn btn-secondary" id="edit-homes" type="button" hidden>
                                <i class="fa-solid fa-pen"></i>
                                <span>Editar datos</span>
                            </button>

                            <button class="btn btn-primary" id="save-homes" type="button" hidden>
                                <i class="fa-solid fa-floppy-disk"></i>
                                <span>Guardar datos</span>
                            </button>
                        </div>
                    </div>
                </section>
            </section>
        </main>
    </div>

    <script src="../js/panelAdminViviendas.js"></script>
</body>

</html>
