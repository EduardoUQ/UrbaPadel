<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/a0c53b3773.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/panelAdminFormularioUrbanizaciones.css">
    <link rel="stylesheet" href="../css/responsivePanelNavigation.css">
    <link rel="shortcut icon" href="../img/UrbaSpaceFavicon.png" type="image/x-icon">
    <title>Crear Urbanización</title>
</head>

<body>
    <div class="admin-shell">
        <aside class="sidebar">
            <a href="panelAdminUrbanizaciones.html" class="brand" aria-label="UrbaPadel">
                <picture>
                    <source media="(min-width: 721px) and (max-width: 980px)" srcset="../img/UrbaSpaceFavicon.png">
                    <img src="../img/UrbaSpaceLogo.png" alt="Logo de UrbaSpace" class="logo">
                </picture>
            </a>

            <div class="sidebar-navigation">
            <nav class="sidebar-nav" aria-label="Gestión global">
                <a href="panelAdminUrbanizaciones.html" class="nav-item active" aria-current="page">
                    <i class="fa-regular fa-building"></i>
                    <span>Mis Urbanizaciones</span>
                </a>
                <a href="panelAdminAdministradores.html" class="nav-item">
                    <i class="fa-solid fa-user-group"></i>
                    <span>Administradores</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="panelAdminAjustes.html" class="nav-item">
                    <i class="fa-solid fa-gear"></i>
                    <span>Ajustes</span>
                </a>
                <a href="#" class="nav-item logout" id="logout">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>Cerrar Sesión</span>
                </a>
            </div>
            </div>
        </aside>

        <main class="main-panel">
            <header class="topbar">
                <div class="breadcrumbs" aria-label="Ruta">
                    <span>Gestión Global</span>
                    <i class="fa-solid fa-chevron-right"></i>
                    <span>Urbanizaciones</span>
                    <i class="fa-solid fa-chevron-right"></i>
                    <strong>Crear Urbanización</strong>
                </div>

                <button class="user-menu" type="button" aria-label="Menú de usuario">
                    <i class="fa-solid fa-user avatar"></i>
                    <span id="admin-name">Super Administrador</span>
                </button>
            </header>

            <section class="content">
                <div class="form-heading">
                    <a href="panelAdminUrbanizaciones.html" class="back-btn" aria-label="Volver a urbanizaciones">
                        <i class="fa-solid fa-arrow-left"></i>
                    </a>
                    <div>
                        <h1>Crear Nueva Urbanización</h1>
                        <p>Añade los datos básicos de la nueva comunidad para comenzar a configurarla.</p>
                    </div>
                </div>

                <form class="urbanization-form" id="urbanization-form">
                    <div class="field icon-field">
                        <label for="urbanName">Nombre de la Urbanización</label>
                        <input id="urbanName" name="urbanName" type="text" placeholder="Ej. Residencial Los Pinos">
                        <p id="error-urbaName"></p>
                    </div>


                    <div class="field icon-field">
                        <label for="address">Dirección</label>
                        <input id="address" name="address" type="text" placeholder="Ej. Avenida de la Ilustración 45">
                        <p id="error-address"></p>
                    </div>

                    <div class="form-grid">
                        <div class="field">
                            <label for="postalCode">Código Postal</label>
                            <input id="postalCode" name="postalCode" type="text" placeholder="Ej. 28001">
                            <p id="error-postalCode"></p>
                        </div>

                        <div class="field">
                            <label for="city">Municipio</label>
                            <input id="city" name="city" type="text" placeholder="Ej. Madrid">
                            <p id="error-city"></p>
                        </div>
                    </div>

                    <div class="field">
                        <label for="province">Provincia</label>
                        <input id="province" name="province" type="text" placeholder="Ej. Madrid">
                        <p id="error-province"></p>
                    </div>

                    <fieldset class="field status-field" id="status-field" hidden>
                        <legend>Estado</legend>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input type="radio" name="activeStatus" value="1" checked>
                                <span>Activa</span>
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="activeStatus" value="0">
                                <span>Inactiva</span>
                            </label>
                        </div>
                    </fieldset>

                    <div class="form-actions">
                        <a class="btn btn-secondary" href="panelAdminUrbanizaciones.html">Cancelar</a>
                        <button class="btn btn-primary" type="submit" id="submit-urbanization">
                            <i class="fa-solid fa-check"></i>
                            <span>Crear Urbanización</span>
                        </button>
                    </div>
                </form>
            </section>
        </main>
    </div>
    <script src="../js/panelAdminFormularioUrbanizaciones.js"></script>
</body>

</html>
